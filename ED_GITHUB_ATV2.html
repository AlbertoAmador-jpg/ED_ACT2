<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Catálogo de películas</title>
    <link rel="stylesheet" href="styles.css" />

    <style>
        /* styles.css */
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, Arial, sans-serif;
            margin: 0;
            background: #f6f7fb;
        }

        .container {
            max-width: 820px;
            margin: 0 auto;
            padding: 24px;
        }

        .panel {
            background: white;
            padding: 16px;
            border-radius: 12px;
            margin: 16px 0;
            box-shadow: 0 1px 8px rgba(0, 0, 0, .06);
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .label {
            display: block;
            margin-top: 10px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d8dbe6;
            border-radius: 10px;
            margin-top: 6px;
        }

        .btn {
            padding: 10px 14px;
            border: 0;
            border-radius: 14px;
            background: #333;
            color: #fff;
            cursor: pointer;
            font-weight: 700;
        }

        .btn2 {
            padding: 10px 14px;
            border: 0;
            border-radius: 10px;
            background: #555;
            color: #fff;
            cursor: pointer;
        }

        .btn3 {
            padding: 10px 14px;
            border: 0;
            border-radius: 10px;
            background: #555;
            color: #fff;
            cursor: pointer;
        }

        .btn:hover {
            filter: brightness(0.92);
        }

        .hint {
            color: #555;
            margin: 12px 0 0;
        }

        .list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 12px;
            border: 1px solid #e6e8f2;
            border-radius: 10px;
            margin-top: 10px;
        }

        .badge {
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 999px;
            background: #eef0ff;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .small {
            padding: 8px 10px;
            border-radius: 10px;
            border: 0;
            cursor: pointer;
            color: white;
            background: #555;
            font-weight: 700;
        }

        .titulo {
            font-family: 'Bebas Neue', Arial, sans-serif;
            font-size: 28px;
            letter-spacing: 1px;
        }

        #addBtn {
            background: #c0392b;
        }

        /* rojo */
        #deleteBtn {
            background: #1f6feb;
        }

        /* azul */
    </style>

</head>

<body>
    <main class="container">
        <h1 class="titulo">🎬 Catálogo de películas</h1>

        <section class="panel">
            <label class="label">Título</label>
            <input id="titleInput" type="text" placeholder="Ej: Interstellar" />

            <label class="label">Año</label>
            <input id="yearInput" type="number" placeholder="Ej: 2014" />

            <div class="row">
                <button id="addBtn" class="btn2">Añadir película</button>
                <button id="deleteBtn" class="btn3">Eliminar película</button>
                <button id="editBtn" class="btn">Editar película</button>
            </div>

            <p class="hint">
                Nota: al inicio solo funcionará “Añadir película”. “Eliminar” y “Editar” se implementarán en ramas.
            </p>
        </section>

        <section class="panel">
            <h2>Lista</h2>
            <ul id="movieList" class="list"></ul>
        </section>
    </main>

    <script src="app.js">
        // app.js
        const titleInput = document.getElementById("titleInput");
        const yearInput = document.getElementById("yearInput");

        const addBtn = document.getElementById("addBtn");
        const deleteBtn = document.getElementById("deleteBtn");
        const editBtn = document.getElementById("editBtn");

        const movieList = document.getElementById("movieList");

        let movies = [];
        let nextId = 1;

        function renderMovies() {
            movieList.innerHTML = "";

            for (const m of movies) {
                const li = document.createElement("li");
                li.className = "item";
                li.dataset.id = String(m.id);

                li.innerHTML = `
      <div>
        <strong>${m.title}</strong>
        <span class="badge">${m.year}</span>
      </div>
      <div class="actions">
        <button class="small del" data-action="delete">Eliminar</button>
        <button class="small edt" data-action="edit">Editar</button>
      </div>
    `;


                movieList.appendChild(li);
            }
        }

        function addMovie() {
            const title = titleInput.value.trim();
            const year = Number(yearInput.value);

            if (!title || !year) {
                alert("Introduce título y año.");
                return;
            }

            movies.push({ id: nextId++, title, year });
            titleInput.value = "";
            yearInput.value = "";
            renderMovies();
        }

        function deleteMovieById(id) {
            movies = movies.filter(m => m.id !== id);
            renderMovies();
        }


        function editMovieById(id) {
            const movie = movies.find(m => m.id === id);
            if (!movie) return;

            const newTitle = prompt("Nuevo título:", movie.title);
            if (newTitle === null) return;

            const newYearStr = prompt("Nuevo año:", String(movie.year));
            if (newYearStr === null) return;

            const newYear = Number(newYearStr);

            if (!newTitle.trim() || !newYear) {
                alert("Datos no válidos.");
                return;
            }

            movie.title = newTitle.trim();
            movie.year = newYear;
            renderMovies();
        }


        // Solo funciona añadir al inicio
        addBtn.addEventListener("click", addMovie);

        // Estos eventos se completarán en ramas
        deleteBtn.addEventListener("click", () => alert("Se implementa en rama eliminar"));
        editBtn.addEventListener("click", () => alert("Se implementa en rama editar"));

        movieList.addEventListener("click", (e) => {
            const btn = e.target.closest("button");
            if (!btn) return;

            const li = e.target.closest("li.item");
            if (!li) return;

            const id = Number(li.dataset.id);

            if (btn.dataset.action === "delete") {
                deleteMovieById(id);
                }
            if (btn.dataset.action === "edit") {
                editMovieById(id);
            }
        });

        renderMovies();
    </script>
</body>

</html>
